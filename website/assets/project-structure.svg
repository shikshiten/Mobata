<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <style>
    .editor-bg { fill: #181824; stroke: rgba(255, 255, 255, 0.12); stroke-width: 1; }
    .topbar { fill: #12121a; }
    .top-tab { fill: #181824; stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #858595; font-weight: 700; letter-spacing: 0.6px; }
    .tab-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #e5e5ea; font-weight: 500; }
    .code-tree { font-family: 'Cascadia Code', 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 13.5px; }
    .guide-line { stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; stroke-dasharray: 2, 2; }
    .branch-line { fill: #5c6370; }
    .dir-name { fill: #e5c07b; font-weight: 700; }
    .file-py { fill: #61afef; font-weight: 600; }
    .file-docker { fill: #4fc1ff; font-weight: 600; }
    .file-compose { fill: #c678dd; font-weight: 600; }
    .file-config { fill: #e5c07b; font-weight: 600; }
    .file-git { fill: #858595; }
    .file-pkg { fill: #e06c75; font-weight: 600; }
    .file-bat { fill: #98c379; font-weight: 600; }
    .file-md { fill: #4ec9b0; font-weight: 600; }
    .file-png { fill: #d19a66; }
    .comment { fill: #6a9955; font-style: italic; }
  </style>

  <!-- VS Code Outer Window Frame -->
  <rect x="10" y="10" width="820" height="430" rx="10" ry="10" class="editor-bg" filter="url(#shadow)"/>

  <!-- Top Titlebar -->
  <path d="M 10 20 Q 10 10 20 10 L 820 10 Q 830 10 830 20 L 830 46 L 10 46 Z" class="topbar"/>
  
  <!-- Window Controls (Red, Yellow, Green) -->
  <circle cx="32" cy="28" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="50" cy="28" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="68" cy="28" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Title / Breadcrumb in Center -->
  <text x="420" y="32" text-anchor="middle" class="title-text">EXPLORER  ▸  MOBATA  ▸  PROJECT ARCHITECTURE</text>

  <!-- Secondary Bar / Editor Tab -->
  <rect x="10" y="46" width="820" height="30" fill="#12121a"/>
  <path d="M 85 46 L 225 46 L 225 76 L 85 76 Z" class="top-tab"/>
  <line x1="85" y1="46" x2="225" y2="46" stroke="#61afef" stroke-width="2"/>
  
  <!-- Tab Icon + Text -->
  <text x="98" y="66" font-size="13">🐍</text>
  <text x="118" y="66" class="tab-text">uploader.py</text>
  
  <text x="240" y="66" font-size="13">🐳</text>
  <text x="260" y="66" class="title-text">Dockerfile</text>
  
  <text x="360" y="66" font-size="13">Ⓜ️</text>
  <text x="380" y="66" class="title-text">README.md</text>

  <!-- Tree Lines &amp; Content -->
  <g class="code-tree" transform="translate(35, 104)">
    
    <!-- Mobata/ -->
    <text x="0" y="0">📂 <tspan class="dir-name">Mobata/</tspan></text>

    <!-- assets/ -->
    <text x="22" y="25" class="branch-line">├──</text>
    <text x="52" y="25">📁 <tspan class="dir-name">assets/</tspan></text>

    <!-- logo-dark.png -->
    <text x="48" y="48" class="guide-line">│</text>
    <text x="52" y="48" class="branch-line">├──</text>
    <text x="82" y="48">🖼️ <tspan class="file-png">logo-dark.png</tspan></text>
    <text x="340" y="48" class="comment"># Dark monochrome brand mark</text>

    <!-- logo.png -->
    <text x="48" y="71" class="guide-line">│</text>
    <text x="52" y="71" class="branch-line">└──</text>
    <text x="82" y="71">🖼️ <tspan class="file-png">logo.png</tspan></text>
    <text x="340" y="71" class="comment"># Monogram mark</text>

    <!-- .env.example -->
    <text x="22" y="94" class="branch-line">├──</text>
    <text x="52" y="94">🔒 <tspan class="file-config">.env.example</tspan></text>
    <text x="340" y="94" class="comment"># Configuration template (fill with your keys)</text>

    <!-- .gitignore -->
    <text x="22" y="117" class="branch-line">├──</text>
    <text x="52" y="117">🛡️ <tspan class="file-git">.gitignore</tspan></text>
    <text x="340" y="117" class="comment"># Keeps your credentials and session 100% private</text>

    <!-- Dockerfile -->
    <text x="22" y="140" class="branch-line">├──</text>
    <text x="52" y="140">🐳 <tspan class="file-docker">Dockerfile</tspan></text>
    <text x="340" y="140" class="comment"># Cloud &amp; container setup</text>

    <!-- docker-compose.yml -->
    <text x="22" y="163" class="branch-line">├──</text>
    <text x="52" y="163">🐙 <tspan class="file-compose">docker-compose.yml</tspan></text>
    <text x="340" y="163" class="comment"># One-command Docker orchestration</text>

    <!-- Procfile -->
    <text x="22" y="186" class="branch-line">├──</text>
    <text x="52" y="186">🚀 <tspan class="file-config">Procfile</tspan></text>
    <text x="340" y="186" class="comment"># For Heroku / Koyeb deployment</text>

    <!-- requirements.txt -->
    <text x="22" y="209" class="branch-line">├──</text>
    <text x="52" y="209">📦 <tspan class="file-pkg">requirements.txt</tspan></text>
    <text x="340" y="209" class="comment"># Python dependencies</text>

    <!-- run_uploader.bat -->
    <text x="22" y="232" class="branch-line">├──</text>
    <text x="52" y="232">⚡ <tspan class="file-bat">run_uploader.bat</tspan></text>
    <text x="340" y="232" class="comment"># 1-Click launcher for Windows</text>

    <!-- uploader.py -->
    <text x="22" y="255" class="branch-line">├──</text>
    <text x="52" y="255">🐍 <tspan class="file-py">uploader.py</tspan></text>
    <text x="340" y="255" class="comment"># Core uploader engine</text>

    <!-- WHY_MOBATA.md -->
    <text x="22" y="278" class="branch-line">├──</text>
    <text x="52" y="278">📖 <tspan class="file-md">WHY_MOBATA.md</tspan></text>
    <text x="340" y="278" class="comment"># In-depth architectural &amp; problem-solving guide</text>

    <!-- README.md -->
    <text x="22" y="301" class="branch-line">└──</text>
    <text x="52" y="301">📝 <tspan class="file-md">README.md</tspan></text>
    <text x="340" y="301" class="comment"># Documentation</text>

  </g>
</svg>
